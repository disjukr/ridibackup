[package]
name = "ridibackup"
version = "0.1.0"
edition = "2021"

[dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_Networking_WinHttp", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Time", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

serde_json = "1.0"
aes = { version = "0.8.2", features = ["hazmat"] }
base64 = "0.22"
flate2 = "1.1"
crc32fast = "1.5"
zeroize = "1.9"
url = "2.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
